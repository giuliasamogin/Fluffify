#fluffifyIntro .nuvem::after {

<script>

(function () {


    /* ========================================================
       ELEMENTOS
       ======================================================== */

    const intro =
        document.getElementById(
            "fluffifyIntro"
        );

    const gato =
        document.getElementById(
            "gato"
        );

    const cabeca =
        document.getElementById(
            "cabecaGato"
        );

    const rabo =
        document.getElementById(
            "raboGato"
        );

    const sombra =
        document.getElementById(
            "sombraGato"
        );

    const olhoEsquerdo =
        document.getElementById(
            "olhoEsquerdo"
        );

    const olhoDireito =
        document.getElementById(
            "olhoDireito"
        );

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    const efeito =
        document.getElementById(
            "efeitoLambida"
        );

    const brilho =
        document.getElementById(
            "brilhoFinal"
        );


    /* ========================================================
       ESPERA
       ======================================================== */

    function esperar(ms) {

        return new Promise(
            resolve =>
                setTimeout(resolve, ms)
        );

    }


    /* ========================================================
       PISCAR
       ======================================================== */

    async function piscar() {

        const olhos = [
            olhoEsquerdo,
            olhoDireito
        ];

        olhos.forEach(olho => {

            olho.animate(

                [
                    {
                        transform:
                            "scaleY(1)"
                    },

                    {
                        transform:
                            "scaleY(.08)"
                    },

                    {
                        transform:
                            "scaleY(1)"
                    }
                ],

                {
                    duration: 260,

                    fill: "forwards",

                    easing:
                        "ease-in-out"
                }

            );

        });

        await esperar(260);

    }


    /* ========================================================
       NUVENS
       ======================================================== */

    const nuvem1 =
        document.querySelector(
            "#fluffifyIntro .nuvem1"
        );

    const nuvem2 =
        document.querySelector(
            "#fluffifyIntro .nuvem2"
        );


    nuvem1.animate(

        [
            {
                transform:
                    "translateX(0)"
            },

            {
                transform:
                    "translateX(calc(100vw + 500px))"
            }
        ],

        {
            duration: 30000,

            iterations:
                Infinity
        }

    );


    nuvem2.animate(

        [
            {
                transform:
                    "translateX(0) scale(.75)"
            },

            {
                transform:
                    "translateX(calc(-100vw - 500px)) scale(.75)"
            }
        ],

        {
            duration: 38000,

            iterations:
                Infinity
        }

    );


    /* ========================================================
       ANIMAÇÃO PRINCIPAL
       ======================================================== */

    async function iniciarAnimacao() {


        /* ----------------------------------------------------
           POSIÇÃO
           ---------------------------------------------------- */

        const centro =
            window.innerWidth / 2 - 115;


        gato.style.left =
            "-280px";


        await esperar(900);


        /* ----------------------------------------------------
           ENTRADA DO GATO
           ---------------------------------------------------- */

        gato.animate(

            [

                {
                    left: "-280px",

                    transform:
                        "translateY(0) rotate(0)"
                },

                {
                    left:
                        (centro - 30) + "px",

                    transform:
                        "translateY(-10px) rotate(-1deg)"
                },

                {
                    left:
                        centro + "px",

                    transform:
                        "translateY(0) rotate(0)"
                }

            ],

            {

                duration: 3500,

                easing:
                    "cubic-bezier(.22,.61,.36,1)",

                fill:
                    "forwards"
            }

        );


        /* ----------------------------------------------------
           RABO DURANTE A CAMINHADA
           ---------------------------------------------------- */

        rabo.animate(

            [

                {
                    transform:
                        "rotate(-8deg)"
                },

                {
                    transform:
                        "rotate(15deg)"
                },

                {
                    transform:
                        "rotate(-2deg)"
                },

                {
                    transform:
                        "rotate(12deg)"
                },

                {
                    transform:
                        "rotate(-8deg)"
                }

            ],

            {

                duration: 720,

                iterations: 5,

                easing:
                    "ease-in-out"
            }

        );


        /* ----------------------------------------------------
           PEQUENO BALANÇO DO CORPO
           ---------------------------------------------------- */

        gato.animate(

            [

                {
                    transform:
                        "translateY(0) rotate(0)"
                },

                {
                    transform:
                        "translateY(-5px) rotate(-1deg)"
                },

                {
                    transform:
                        "translateY(0) rotate(1deg)"
                },

                {
                    transform:
                        "translateY(-4px) rotate(0)"
                },

                {
                    transform:
                        "translateY(0) rotate(0)"
                }

            ],

            {

                duration: 800,

                iterations: 4,

                easing:
                    "ease-in-out"
            }

        );


        await esperar(3500);


        /* ----------------------------------------------------
           PARADA FOFA
           ---------------------------------------------------- */

        gato.animate(

            [

                {
                    transform:
                        "translateY(0) scale(1)"
                },

                {
                    transform:
                        "translateY(8px) scaleY(.93) scaleX(1.04)"
                },

                {
                    transform:
                        "translateY(4px) scaleY(.97) scaleX(1.02)"
                },

                {
                    transform:
                        "translateY(0) scale(1)"
                }

            ],

            {

                duration: 750,

                fill:
                    "forwards",

                easing:
                    "cubic-bezier(.34,1.56,.64,1)"
            }

        );


        sombra.animate(

            [

                {
                    transform:
                        "scaleX(1)"
                },

                {
                    transform:
                        "scaleX(1.18)"
                },

                {
                    transform:
                        "scaleX(1.05)"
                }

            ],

            {

                duration: 750,

                fill:
                    "forwards"
            }

        );


        await esperar(800);


        /* ----------------------------------------------------
           OLHA PARA UM LADO
           ---------------------------------------------------- */

        cabeca.animate(

            [

                {
                    transform:
                        "rotate(0)"
                },

                {
                    transform:
                        "rotate(-7deg)"
                },

                {
                    transform:
                        "rotate(5deg)"
                },

                {
                    transform:
                        "rotate(0)"
                }

            ],

            {

                duration: 1300,

                fill:
                    "forwards",

                easing:
                    "ease-in-out"
            }

        );


        await esperar(700);


        /* ----------------------------------------------------
           PISCADA
           ---------------------------------------------------- */

        await piscar();


        await esperar(500);


        /* ----------------------------------------------------
           CABEÇA INCLINA
           ---------------------------------------------------- */

        cabeca.animate(

            [

                {
                    transform:
                        "rotate(0)"
                },

                {
                    transform:
                        "rotate(-8deg)"
                },

                {
                    transform:
                        "rotate(4deg)"
                },

                {
                    transform:
                        "rotate(0)"
                }

            ],

            {

                duration: 1000,

                fill:
                    "forwards",

                easing:
                    "ease-in-out"
            }

        );


        /* ----------------------------------------------------
           RABO FOFO
           ---------------------------------------------------- */

        rabo.animate(

            [

                {
                    transform:
                        "rotate(-8deg)"
                },

                {
                    transform:
                        "rotate(17deg)"
                },

                {
                    transform:
                        "rotate(-4deg)"
                },

                {
                    transform:
                        "rotate(12deg)"
                },

                {
                    transform:
                        "rotate(-8deg)"
                }

            ],

            {

                duration: 1000,

                iterations: 2,

                easing:
                    "ease-in-out"
            }

        );


        await esperar(1200);


        /* ----------------------------------------------------
           MENSAGEM APARECE
           ---------------------------------------------------- */

        mensagem.animate(

            [

                {
                    opacity: 0,

                    transform:
                        "translateX(-50%) translateY(15px)"
                },

                {
                    opacity: 1,

                    transform:
                        "translateX(-50%) translateY(0)"
                }

            ],

            {

                duration: 800,

                fill:
                    "forwards",

                easing:
                    "ease-out"
            }

        );


        await esperar(1000);


        /* ----------------------------------------------------
           RESPIRAÇÃO DO GATO
           ---------------------------------------------------- */

        gato.animate(

            [

                {
                    transform:
                        "translateY(0) scale(1)"
                },

                {
                    transform:
                        "translateY(-2px) scale(1.015)"
                },

                {
                    transform:
                        "translateY(0) scale(1)"
                }

            ],

            {

                duration: 1800,

                iterations: 2,

                easing:
                    "ease-in-out"
            }

        );


        await esperar(2200);


        /* ----------------------------------------------------
           SEGUNDA PISCADA
           ---------------------------------------------------- */

        await piscar();


        await esperar(700);


        /* ----------------------------------------------------
           OLHA DIRETAMENTE PARA A TELA
           ---------------------------------------------------- */

        cabeca.animate(

            [

                {
                    transform:
                        "rotate(0) scale(1)"
                },

                {
                    transform:
                        "rotate(-2deg) scale(1.03)"
                },

                {
                    transform:
                        "rotate(0) scale(1)"
                }

            ],

            {

                duration: 800,

                fill:
                    "forwards",

                easing:
                    "ease-in-out"
            }

        );


        await esperar(700);


        /* ----------------------------------------------------
           TEXTO SOME
           ---------------------------------------------------- */

        mensagem.animate(

            [

                {
                    opacity: 1,

                    transform:
                        "translateX(-50%) translateY(0)"
                },

                {
                    opacity: 0,

                    transform:
                        "translateX(-50%) translateY(-15px)"
                }

            ],

            {

                duration: 500,

                fill:
                    "forwards"
            }

        );


        await esperar(400);


        /* ====================================================
           APROXIMAÇÃO DO GATO
           ==================================================== */

        gato.animate(

            [

                {
                    transform:
                        "translateY(0) scale(1)"
                },

                {
                    transform:
                        "translateY(8px) scale(1.5)"
                },

                {
                    transform:
                        "translateY(25px) scale(2.6)"
                },

                {
                    transform:
                        "translateY(50px) scale(4.5)"
                },

                {
                    transform:
                        "translateY(75px) scale(7)"
                }

            ],

            {

                duration: 3000,

                fill:
                    "forwards",

                easing:
                    "cubic-bezier(.55,0,1,.45)"
            }

        );


        await esperar(1900);


        /* ====================================================
           BLUR COMEÇA ENQUANTO ELE SE APROXIMA
           ==================================================== */

        efeito.animate(

            [

                {
                    opacity: 0,

                    backdropFilter:
                        "blur(0px)",

                    webkitBackdropFilter:
                        "blur(0px)"
                },

                {
                    opacity: .35,

                    backdropFilter:
                        "blur(2px)",

                    webkitBackdropFilter:
                        "blur(2px)"
                },

                {
                    opacity: .72,

                    backdropFilter:
                        "blur(7px)",

                    webkitBackdropFilter:
                        "blur(7px)"
                },

                {
                    opacity: 1,

                    backdropFilter:
                        "blur(16px)",

                    webkitBackdropFilter:
                        "blur(16px)"
                }

            ],

            {

                duration: 1700,

                fill:
                    "forwards",

                easing:
                    "ease-in-out"
            }

        );


        await esperar(1500);


        /* ====================================================
           BRILHO DE TRANSIÇÃO
           ==================================================== */

        brilho.animate(

            [

                {
                    opacity: 0
                },

                {
                    opacity: .35
                },

                {
                    opacity: 1
                }

            ],

            {

                duration: 850,

                fill:
                    "forwards",

                easing:
                    "ease-in-out"
            }

        );


        await esperar(750);


        /* ====================================================
           INTRO SOME
           ==================================================== */

        intro.style.opacity =
            "0";


        await esperar(1100);


        /* ====================================================
           REMOVE A INTRO
           ==================================================== */

        intro.remove();

    }


    /* ========================================================
       INICIAR
       ======================================================== */

    iniciarAnimacao();


})();

</script>
